# iCloud Mail MCP behind a Cloudflare Tunnel. No port is published on the
# host; only cloudflared reaches the server. See docs/REMOTE.md.
services:
  icloud-mail:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: icloud-mail.env
    environment:
      # Trust the X-Forwarded-For hop added by cloudflared for rate limiting.
      ICLOUD_MAIL_TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN to the Cloudflare tunnel token}
    depends_on:
      - icloud-mail
    restart: unless-stopped
