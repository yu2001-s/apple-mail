# Keep this name stable if branch protection uses it as a required context.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo (checkout + pnpm). Publishing
# and code-scanning grant their own scoped tokens in their own workflows.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      # pnpm 11.9 (packageManager) requires Node >= 22.13, so CI exercises the
      # dev toolchain on 22 (LTS) and 24 (current). The published server itself
      # still runs on Node >= 20 (engines.node) — pnpm is dev/CI-only.
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Verify plugin manifests match package.json version
        run: node scripts/sync-plugin-version.mjs --check

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        if: matrix.node-version == 22
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Verify committed plugin bundle matches source
        run: git diff --exit-code -- plugins/icloud-mail/server plugins/icloud-mail/LICENSE

  bundle-boots:
    name: bundle-boots (standalone, Node 20)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - name: Boot the committed bundle without installed dependencies
        run: node --test test/plugin-boot.test.mjs

  # IMAP backend integration tests run against a real IMAP server (GreenMail).
  # The direct IMAP transport runs on Linux with GreenMail as a service container.
  imap-integration:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.0
        ports:
          - 3143:3143
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=tester:secret@example.com
            -Dgreenmail.verbose
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        # pnpm does not enforce the ROOT package's `os: ["darwin"]` field (only
        # dependencies' platform constraints), so a plain frozen install works on
        # Linux here — no `--force` equivalent needed (npm ci required `--force`
        # to bypass EBADPLATFORM). The IMAP code path is platform-agnostic.
        run: pnpm install --frozen-lockfile

      - name: Wait for GreenMail IMAP (localhost:3143)
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3143) >/dev/null 2>&1; then echo "IMAP up"; exit 0; fi
            sleep 1
          done
          echo "::error::GreenMail IMAP did not become ready"; exit 1

      - name: Run IMAP integration tests
        run: pnpm run test:imap
        env:
          RUN_IMAP_IT: "1"
          GREENMAIL_HOST: 127.0.0.1
          GREENMAIL_IMAP_PORT: "3143"
          GREENMAIL_USER: tester
          GREENMAIL_PASS: secret
